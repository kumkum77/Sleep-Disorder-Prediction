<!DOCTYPE html>
<html>
<head>

<title>Prediction Result</title>

<style>

body{
background-image:url("{{ url_for('static', filename='sleepdisorder.jpg') }}");
background-size:cover;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:Arial;
}

.container{
background:rgba(255,255,255,0.9);
padding:40px;
border-radius:15px;
text-align:center;
width:450px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

h1{
color:#5a5af7;
}

.result{
font-size:22px;
margin:20px 0;
}

.advice{
font-size:16px;
color:#444;
margin-top:10px;
}

button{
padding:10px 20px;
background:#5a5af7;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#3d3df5;
}

</style>

</head>

<body>

<div class="container">

<h1>Prediction Result</h1>

<p class="result">
You may have: <b>{{ prediction }}</b>
</p>

<h3>Sleep Improvement Advice</h3>

<p class="advice">
{{ advice }}
</p>

<br>

<a href="/">
<button>Go Back</button>
</a>

</div>

</body>
</html>
